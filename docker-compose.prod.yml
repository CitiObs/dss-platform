services:
  co-frontend:
    build:
      context: .
      dockerfile: docker/Dockerfile
    container_name: citiobs2-frontend
    restart: unless-stopped
    volumes:
      - ./public/sensor-cache:/var/www/html/sensor-cache
    ports:
      - "3002:80"
    environment:
      - VIRTUAL_HOST=dss.citiobs.eu
      - LETSENCRYPT_HOST=dss.citiobs.eu
      - LETSENCRYPT_EMAIL=dev@draxis.gr

  keycloak:
    image: quay.io/keycloak/keycloak:26.2
    container_name: citiobs2-keycloak
    restart: unless-stopped
    ports:
      - "8082:8080"
    environment:
      - KC_BOOTSTRAP_ADMIN_USERNAME=admin
      - KC_BOOTSTRAP_ADMIN_PASSWORD=admin
      - KC_PROXY_HEADERS=xforwarded
      - KC_HTTP_ENABLED=true
      - KC_HOSTNAME_STRICT=false
      - KC_HOSTNAME=https://auth.dss.citiobs.eu
      - VIRTUAL_HOST=auth.dss.citiobs.eu
      - VIRTUAL_PORT=8080
      - LETSENCRYPT_HOST=auth.dss.citiobs.eu
      - LETSENCRYPT_EMAIL=dev@draxis.gr
    command: start --import-realm
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./docker/keycloak/citiobs-realm.json:/opt/keycloak/data/import/citiobs-realm.json:ro

volumes:
  keycloak_data:

networks:
  default:
    name: nginx-proxy-citiobs
    external: true
