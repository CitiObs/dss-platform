services:
  co-frontend:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - .:/app
      - node_modules:/app/node_modules
    ports:
      - "3002:3002"
    command: sh -c "npm install && npx vite --host 0.0.0.0 --port 3002"
    environment:
      - VITE_APP_TITLE=CitiObs DSS
      - VITE_KEYCLOAK_URL=http://localhost:8080
      - VITE_KEYCLOAK_REALM=citiobs
      - VITE_KEYCLOAK_CLIENT_ID=co-frontend

volumes:
  node_modules:
